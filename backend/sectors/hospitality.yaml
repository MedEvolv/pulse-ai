sector: hospitality
display_name: Hospitality
depth: stub
reference: Multi-property resort group (synthetic, Hotel-Booking-Demand-shaped)

labels:
  location: Property
  customer: Guest
  operator: Property manager
  region: Cluster
  cohort: Guest segment
  intervention: Post-stay re-engagement

headline:
  ltv_cac: 2.5
  band: [2.0, 3.0]
  binding_constraint: revenue

stage_labels:
  spend: Acquisition
  revenue: Booking
  retention: Re-booking
  expansion: Upsell / package
  referral: Guest referral

rulesets:
  - "Guest-stay confidentiality + payment-data isolation; no raw guest data or payment info in the narrative"
  - "Closure proof must carry a named property-manager sign-off"

protocols:
  data_sources:
    - name: PMS (Property Management System)
      format: csv_export
      cadence: weekly
    - name: Booking engine
      format: csv_export
      cadence: daily

policies:
  closure_proof: Booking + post-stay feedback
  escalation: front-desk manager -> GM -> brand

cadences:
  recall: 90-day post-stay, 1-year anniversary
  lapse_threshold_days: 365
  reactivation: property-routed email (30d) + property-routed SMS (90d)
  reactivation_owner: Property manager
